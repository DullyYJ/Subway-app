name: Load bus hours

# 버스 첫차·막차·배차를 D1(subway-db)의 bus_routes 에 채워 넣는다. 수동 실행 전용.
#
# 필요한 Secrets (Settings > Secrets and variables > Actions)
#   TAGO_KEY        공공데이터포털 '일반 인증키(Decoding)'
#   CF_API_TOKEN / CF_ACCOUNT_ID   (이미 등록돼 있음)
#
# 노선이 21,485개라 배차(interval)는 하루 트래픽 1만으로 한 번에 못 끝낸다.
# 이미 채워진 노선은 건너뛰므로, interval 을 켠 채로 며칠 나눠 돌리면 이어서 채워진다.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: '배차까지 채우기 (노선별 조회 · 하루 최대 9000개씩 이어서)'
        type: boolean
        default: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 사전 점검
        env:
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
        run: |
          fail=0
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::CF_API_TOKEN 시크릿이 비어 있습니다"; fail=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CF_ACCOUNT_ID 시크릿이 비어 있습니다"; fail=1; }
          [ -n "$TAGO_KEY" ]              || { echo "::error::TAGO_KEY 시크릿이 비어 있습니다"; fail=1; }
          echo "TAGO_KEY 길이: ${#TAGO_KEY}"
          case "$TAGO_KEY" in
            *%2B*|*%2F*|*%3D*) echo "::warning::인증키에 %2B/%2F%3D 가 보입니다 — Encoding 키를 넣은 것 같습니다. Decoding 키로 바꾸세요";;
          esac
          [ -f tools/load-bus-hours.py ] || { echo "::error::tools/load-bus-hours.py 가 없습니다"; fail=1; }
          exit $fail

      - name: D1 컬럼 확인
        run: |
          npx --yes wrangler@3 d1 execute subway-db --remote \
            --command "SELECT name FROM pragma_table_info('bus_routes')"

      - name: D1 에서 노선 목록 뽑기
        run: |
          set -o pipefail
          npx --yes wrangler@3 d1 execute subway-db --remote --json \
            --command "SELECT route_key, city_code, route_id, itv_wd FROM bus_routes" > d1.raw 2> d1.err || {
              echo "::error::wrangler d1 execute 실패"; tail -40 d1.err; exit 1; }
          echo "── d1.raw 앞 200자"; head -c 200 d1.raw; echo
          node -e "
            const fs=require('fs');
            let t=fs.readFileSync('d1.raw','utf8');
            // wrangler 가 JSON 앞뒤로 배너를 찍는 판이 있어 첫 대괄호/중괄호부터 잘라 쓴다
            const i=Math.min(...[t.indexOf('['),t.indexOf('{')].filter(x=>x>=0));
            if(!isFinite(i)) { console.error('JSON 을 못 찾음. 원문:'); console.error(t.slice(0,500)); process.exit(1); }
            t=t.slice(i);
            let j; try{ j=JSON.parse(t); }catch(e){
              console.error('JSON 파싱 실패:', e.message); console.error(t.slice(0,500)); process.exit(1); }
            const rows=(Array.isArray(j)?j[0]:j).results||[];
            if(!rows.length){ console.error('결과 0행 — bus_routes 가 비었거나 컬럼명이 다릅니다'); process.exit(1); }
            fs.writeFileSync('routes.json', JSON.stringify(rows));
            const done=rows.filter(r=>r.itv_wd).length;
            console.log('노선', rows.length, '개 / 배차 이미 채워짐', done, '개');
          "

      - name: TAGO 조회 → SQL 생성
        env:
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
        run: |
          python3 -u tools/load-bus-hours.py \
            --routes routes.json --out fill.sql --chunk 2000 \
            ${{ inputs.interval && '--interval' || '' }}
          ls -la fill.*.sql || { echo "::error::SQL 이 하나도 안 만들어졌습니다"; exit 1; }
          echo "── 첫 파일 앞 5줄"; head -5 fill.001.sql

      - name: D1 에 적용
        run: |
          for f in fill.*.sql; do
            echo "── $f"
            npx --yes wrangler@3 d1 execute subway-db --remote --file="$f"
          done

      - name: 결과 확인
        if: always()
        run: |
          npx --yes wrangler@3 d1 execute subway-db --remote --command \
            "SELECT COUNT(*) total, SUM(CASE WHEN start_time IS NOT NULL THEN 1 ELSE 0 END) hours, SUM(CASE WHEN itv_wd IS NOT NULL THEN 1 ELSE 0 END) itv FROM bus_routes" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-sql
          path: |
            fill.*.sql
            d1.raw
            d1.err
          if-no-files-found: ignore
