name: Load bus hours

# 수동 실행 전용. 버스 첫차·막차·배차를 D1 에 채워 넣는다.
#   Settings > Secrets and variables > Actions 에 두 개가 필요하다:
#     TAGO_KEY              공공데이터포털 '일반 인증키(Decoding)'
#     CLOUDFLARE_API_TOKEN  D1 편집 권한 토큰
#     CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
    inputs:
      interval:
        description: '배차(intervaltime)까지 노선별로 조회 (오래 걸림)'
        type: boolean
        default: false

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: D1 에서 route_key 목록 뽑기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 d1 execute subway-db --remote --json \
            --command "SELECT route_key FROM bus_routes" > d1.json
          node -e "
            const j=JSON.parse(require('fs').readFileSync('d1.json','utf8'));
            const rows=(Array.isArray(j)?j[0]:j).results||[];
            require('fs').writeFileSync('routes.json', JSON.stringify(rows));
            console.log('route_key', rows.length, '개');
          "

      - name: TAGO 조회 → SQL 생성
        env:
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
        run: |
          python3 tools/load-bus-hours.py \
            --routes routes.json --out fill.sql \
            ${{ inputs.interval && '--interval' || '' }}
          echo "=== 앞 20줄 ==="; head -20 fill.sql; wc -l fill.sql

      - name: D1 에 적용
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 d1 execute subway-db --remote --file=fill.sql
          npx wrangler@3 d1 execute subway-db --remote \
            --command "SELECT COUNT(*) total, SUM(CASE WHEN start_time IS NOT NULL THEN 1 ELSE 0 END) filled FROM bus_routes"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-sql
          path: fill.sql
